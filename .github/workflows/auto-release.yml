name: Release Management

on:
  push:
    tags:
      # Release tags are bare version numbers (2.0.0), per nf-core convention — the
      # "v" belongs only in the displayed name, which getWorkflowVersion() prepends.
      # The legacy v1.0-v1.2.0 tags keep their prefix, so both forms are matched here;
      # the step below strips any leading "v". A "v*.*.*"-only filter is what stopped
      # the 1.3.0 tag from ever producing a release.
      - "*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          # Remove 'v' prefix if present (e.g., v1.1.0 -> 1.1.0)
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
