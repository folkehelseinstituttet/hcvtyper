name: nf-core CI
# This workflow runs the pipeline with the minimal test dataset to check that it completes without any syntax errors
on:
  push:
    branches:
      - dev
  pull_request:
  release:
    types: [published]

env:
  NXF_ANSI_LOG: false

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Run pipeline with test data
    # Only run on push if this is the nf-core dev branch (merged PRs)
    if: "${{ github.event_name != 'push' || (github.event_name == 'push' && github.repository == 'folkehelseinstituttet/hcvtyper') }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        NXF_VER:
          - "24.04.0"
          - "latest-everything"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Run pipeline with test data
        # TODO nf-core: You can customise CI pipeline run tests as required
        # For example: adding multiple test runs with different parameters
        # Remember that you can parallelise this by using strategy.matrix
        run: |
          nextflow run ${GITHUB_WORKSPACE} -profile test,docker --outdir ./results

  r-regression:
    name: R regression guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      # R env: reuse the pre-baked PARSEFIRSTMAPPING Seqera container
      # (r-seqinr + r-tidyverse) — exact deps the suite needs, pinned tag (not
      # :latest), no apt/conda tidyverse-from-source build flakiness, version
      # parity with the pipeline (RESEARCH D-10).
      - name: Run R regression guard
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            community.wave.seqera.io/library/r-seqinr_r-tidyverse:5358395134867368 \
            bash bin/tests/run_all.sh
