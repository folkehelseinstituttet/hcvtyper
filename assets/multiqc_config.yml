report_comment: >
  This report has been generated by the <a href="https://github.com/folkehelseinstituttet/HCVTyper" target="_blank">folkehelseinstituttet/HCVTyper</a>
  analysis pipeline.
report_section_order:
  "results_summary":
    order: 1
  "glue_resistance":
    order: 2
  "folkehelseinstituttet-hcvtyper-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "folkehelseinstituttet-hcvtyper-summary":
    order: -1002

export_plots: true

# Don't read version information from software output. Read from the collected version file instead
disable_version_detection: true

# Run only these modules
run_modules:
  - custom_content
  - fastqc
  - cutadapt
  - fastp
  - prinseqplusplus
  - kraken
  - software_versions

# Kraken module options (applies to both Kraken instances below)
kraken:
  top_n: 10

module_order:
  - fastqc:
      name: "FastQC (raw)"
      path_filters:
        - "*.raw_*.zip"
  - cutadapt:
      name: "Cutadapt"
      path_filters:
        - "*.cutadapt.log"
  - fastp:
      name: "Fastp"
      path_filters:
        - "*.fastp.json"
  - prinseqplusplus:
      name: "prinseq++"
  - fastqc:
      name: "FastQC (trimmed)"
      path_filters:
        - "*.trimmed_*.zip"
  - kraken:
      name: "Kraken2 all database"
      path_filters:
        - "*entireDB*.txt"
  - kraken:
      name: "Kraken2 focused"
      path_filters:
        - "*focused*.txt"

custom_data:
  # -------------------------------------------------------------------------
  # Primary triage table — 6 problem-signal flags + final call
  # -------------------------------------------------------------------------
  results_summary:
    id: "results_summary"
    fn: "*/summary_mqc.tsv"
    file_format: "tsv"
    plot_type: "table"
    section_name: "Results summary"
    pconfig:
      id: "results_summary_table"
      col1_header: "Sample"
      only_defined_headers: false
      headers:
        sampleName:
          title: "Sample"
          placement: 0
        subtype_conflict:
          title: "Subtype conflict"
          description: "CONFLICT when de novo assembly and mapping disagree on the major subtype. OK when they agree. NA when no assembly was available."
          placement: 10
          cond_formatting_rules:
            - pass:
                - s_eq: "OK"
            - fail:
                - s_eq: "CONFLICT"
        rescue_flag:
          title: "Rescue"
          description: "TRUE when the de-novo rescue step replaced the first-mapping reference for at least one candidate."
          placement: 20
          cond_formatting_rules:
            - warn:
                - s_eq: "TRUE"
            - pass:
                - s_eq: "FALSE"
        Major_avg_depth:
          title: "Depth (major)"
          description: "Mean read depth across the major-strain consensus."
          suffix: "×"
          format: "{:,.0f}"
          placement: 30
          scale: "RdYlGn"
          min: 0
          max: 1000
        Reads_nodup_mapped_major:
          title: "Mapped reads (major)"
          description: "De-duplicated reads mapped to the major-strain reference."
          format: "{:,.0f}"
          placement: 40
          scale: "RdYlGn"
          min: 0
          max: 100000
        percent_mapped_reads_major_firstmapping:
          title: "Mapping % (major)"
          description: "Percentage of trimmed reads that mapped to the major-strain reference at first-mapping."
          suffix: "%"
          format: "{:,.1f}"
          placement: 50
          scale: "RdYlGn"
          min: 0
          max: 100
        co_infection:
          title: "Co-infection"
          description: "CO-INFECTION when more than one HCV subtype/genotype was detected."
          placement: 60
          cond_formatting_rules:
            - warn:
                - s_eq: "CO-INFECTION"
        overall_sample_call:
          title: "Final call"
          description: "Overall sample classification: monoinfection, co-infection, indeterminate, or co-infection (indeterminate dominance)."
          placement: 70
        Major:
          title: "Major subtype"
          description: "Dominant HCV subtype."
          placement: 80
        Minor:
          title: "Minor subtype"
          description: "Minor (co-infecting) HCV subtype. Empty for monoinfection samples."
          placement: 90
        review_flag:
          title: "Review note"
          description: "Human-readable reasons why this sample may require manual inspection. Empty when the call is clean."
          placement: 100
          cond_formatting_rules:
            - warn:
                - s_contains: "Please review"
                - s_contains: "refuted"
                - s_contains: "uncertain"
        total_trimmed_reads:
          title: "Trimmed reads"
          description: "Total reads after adapter trimming."
          format: "{:,.0f}"
          placement: 110
        Major_cov_breadth_min_10:
          title: "Breadth ≥10× (major)"
          description: "Fraction of the major-strain reference covered at ≥10× depth."
          suffix: "%"
          format: "{:,.1f}"
          placement: 120
          scale: "RdYlGn"
          min: 0
          max: 100
        Major_cov_breadth_min_5:
          title: "Breadth ≥5× (major)"
          description: "Fraction of the major-strain reference covered at ≥5× depth."
          suffix: "%"
          format: "{:,.1f}"
          placement: 130
          scale: "RdYlGn"
          min: 0
          max: 100
        Percent_reads_mapped_of_trimmed_with_dups_major:
          title: "Mapped % (dedup, major)"
          description: "Percentage of trimmed reads mapping to the major-strain reference, computed from de-duplicated counts."
          suffix: "%"
          format: "{:,.1f}"
          placement: 140
          scale: "RdYlGn"
          min: 0
          max: 100
        Major_consensus_similarity_pct:
          title: "Consensus similarity (major)"
          description: "Global alignment identity between the major-strain consensus and reference (%)."
          suffix: "%"
          format: "{:,.2f}"
          placement: 150
          scale: "RdYlGn"
          min: 90
          max: 100
        Major_consensus_n_differences:
          title: "Consensus differences (major)"
          description: "Number of positions where the major-strain consensus differs from the reference."
          format: "{:,.0f}"
          placement: 160

  # -------------------------------------------------------------------------
  # HCV-GLUE resistance section
  # -------------------------------------------------------------------------
  glue_resistance:
    id: "glue_resistance"
    fn: "*/glue_resistance_mqc.tsv"
    file_format: "tsv"
    plot_type: "table"
    section_name: "Resistance (HCV-GLUE)"
    description: >
      Drug resistance predictions from HCV-GLUE for each sample.
      Co-infection samples have two rows: the major strain (sample name)
      and the minor strain (sample name [minor]).
    pconfig:
      id: "glue_resistance_table"
      col1_header: "Sample"
      only_defined_headers: false
