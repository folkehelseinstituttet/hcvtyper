        # NS3/4A inhibitors
        glecaprevir:
          title: "Glecaprevir"
          description: "NS3/4A inhibitor resistance status."
          placement: 10
          cond_formatting_rules:
            - fail:
                - s_eq: "Resistance"
            - warn:
                - s_contains: "Probable resistance"
                - s_contains: "Possible resistance"
            - pass:
                - s_eq: "No resistance"
        glecaprevir_mut:
          title: "Glecaprevir mutations"
          description: "Full mutation list for glecaprevir resistance."
          placement: 11
        glecaprevir_mut_short:
          title: "Glecaprevir mutations (short)"
          description: "Short mutation names for glecaprevir resistance."
          placement: 12
